name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (windows-latest / MSVC)
    runs-on: windows-latest
    # 一次真实构建约 3 分钟；30 分钟是「挂死时早点报错」的上限，
    # 而不是性能约束——GitHub 默认单 job 可挂 6 小时才被强杀。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      # 发布流程会跑这一步（把图标写进 .rsrc 节）。在 CI 里也跑，是为了让
      # 「只有打 tag 时才发现嵌图标挂了」这种事不再发生——alpha.2 就是这么
      # 白丢一个序数的。
      - name: Embed icon resource
        run: python tools/embed_icon.py target/release/mftfind.exe

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/mftfind.exe
          "mftfind.exe: {0:N1} MB" -f ($exe.Length / 1MB)
